<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>แฮมสเตอร์ลงทะเบียน 🐹</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ind:#6366F1;--pur:#8B5CF6;--pink:#F472B6;
  --bg1:#C7D2FE;--bg2:#BAE6FD;
  --txt:#1F2937;--sub:#6B7280;--bdr:#E5E7EB;--wht:#fff;
}
html,body{height:100%;font-family:'Sarabun','Noto Sans Thai',sans-serif}
body{
  background:linear-gradient(150deg,var(--bg1) 0%,var(--bg2) 100%);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

/* ── paw BG ── */
#pawBg{position:fixed;inset:0;pointer-events:none;z-index:0}
#pawBg span{
  position:absolute;opacity:.06;font-size:var(--sz);transform:rotate(var(--rot));
  animation:pawBob var(--dur) var(--delay) ease-in-out infinite alternate;
}
@keyframes pawBob{from{transform:rotate(var(--rot)) translateY(0)}to{transform:rotate(var(--rot)) translateY(-14px)}}

/* ── hearts overlay ── */
#heartsLayer{position:fixed;inset:0;pointer-events:none;z-index:600}

/* ── app card ── */
.app{
  position:relative;z-index:1;
  width:min(390px,96vw);
  height:min(740px,96dvh);
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-radius:40px;
  box-shadow:0 32px 64px rgba(99,102,241,.22),0 0 0 1.5px rgba(255,255,255,.8) inset;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;padding:0 0 28px;
}

/* ── game HUD ── */
.hud{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:18px 24px 6px;
}
.hud-box{
  background:var(--wht);border-radius:16px;padding:8px 16px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center;min-width:80px;
}
.hud-label{font-size:.68rem;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase}
.hud-val  {font-size:1.5rem;font-weight:800;color:var(--ind);line-height:1.1}
.hud-val.bump{animation:bump .25s cubic-bezier(.36,.07,.19,.97)}
@keyframes bump{0%,100%{transform:scale(1)}45%{transform:scale(1.5)}}

/* ── hamster area ── */
.ham-area{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  margin-top:8px;
}
.ham-wrap{
  position:relative;width:220px;height:220px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;touch-action:none;
}
#hamSVG{
  width:210px;height:210px;pointer-events:none;
  filter:drop-shadow(0 12px 24px rgba(99,102,241,.25));
  animation:floatie 3s ease-in-out infinite;
  transition:transform .06s ease-out, filter .06s ease-out;
}
@keyframes floatie{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%    {transform:translateY(-8px) rotate(2deg)}
}
#hamSVG.pop{
  animation:none!important;
  transform:scale(1.1) translateY(-4px)!important;
  filter:drop-shadow(0 4px 18px rgba(244,114,182,.7)) brightness(1.08)!important;
}
/* ripple */
.ripple{
  position:absolute;border-radius:50%;
  width:200px;height:200px;top:50%;left:50%;margin:-100px;
  background:rgba(244,114,182,.18);transform:scale(0);
  pointer-events:none;animation:ripAnim .6s ease-out forwards;
}
@keyframes ripAnim{to{transform:scale(2.2);opacity:0}}

/* ── form area ── */
.form-area{
  width:100%;padding:0 22px;display:flex;flex-direction:column;
  align-items:center;gap:12px;flex:1;justify-content:flex-end;
}

/* speech bubble */
.bubble{
  background:var(--wht);border-radius:22px;padding:14px 20px;
  width:100%;text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.08);position:relative;
}
.bubble::before{
  content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  border:10px solid transparent;border-bottom:11px solid var(--wht);border-top:0;
}
.bubble p{font-size:.97rem;font-weight:600;line-height:1.6;color:var(--txt)}
.bubble .speaker{font-size:.72rem;font-weight:700;color:var(--ind);margin-bottom:3px;letter-spacing:.03em}

.bubble.swap-out{animation:swapOut .18s ease forwards}
.bubble.swap-in {animation:swapIn  .25s ease forwards}
@keyframes swapOut{to  {opacity:0;transform:translateY(-8px)}}
@keyframes swapIn {from{opacity:0;transform:translateY(8px)}}

/* input row */
.input-row{
  width:100%;display:flex;align-items:center;gap:10px;
  background:var(--wht);border:2.5px solid var(--bdr);
  border-radius:18px;padding:14px 16px;
  transition:border-color .2s,box-shadow .2s;
}
.input-row:focus-within{border-color:var(--ind);box-shadow:0 0 0 3.5px rgba(99,102,241,.13)}
.input-row.shake{
  border-color:#F87171;box-shadow:0 0 0 3px rgba(248,113,113,.18);
  animation:shake .35s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}
.inp-ico  {font-size:1.2rem;flex-shrink:0}
.inp-field{
  flex:1;border:none;outline:none;
  font-size:1rem;font-family:inherit;color:var(--txt);background:transparent;
}
.inp-field::placeholder{color:#C4C9D8}

/* buttons */
.btn-row{display:flex;flex-direction:column;align-items:center;gap:8px}
.next-btn{
  width:64px;height:64px;border:none;border-radius:50%;
  background:linear-gradient(135deg,var(--ind),var(--pur));
  font-size:1.9rem;display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(99,102,241,.42);
  transition:transform .12s,box-shadow .12s;
}
.next-btn:active{transform:scale(.92);box-shadow:0 4px 10px rgba(99,102,241,.3)}
.skip-btn{
  background:none;border:none;cursor:pointer;
  font-size:.84rem;color:var(--sub);font-family:inherit;
  text-decoration:underline;padding:4px 8px;display:none;
}
.skip-btn:hover{color:var(--ind)}

/* progress dots */
.prog-dots{display:flex;gap:7px}
.pdot{
  width:8px;height:8px;border-radius:50%;background:var(--bdr);
  transition:background .3s,transform .3s;
}
.pdot.done  {background:#A5B4FC}
.pdot.active{background:var(--ind);transform:scale(1.4)}

/* ── success overlay ── */
#successOverlay{
  position:fixed;inset:0;z-index:700;
  background:rgba(99,102,241,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
}
#successOverlay.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.suc-card{
  background:var(--wht);border-radius:32px;padding:32px 28px;text-align:center;
  max-width:min(340px,92vw);
  box-shadow:0 28px 56px rgba(0,0,0,.16);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.suc-ham{width:110px;height:110px;margin:0 auto;animation:wiggle 1.1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.suc-title{font-size:1.5rem;font-weight:800;color:var(--txt);margin:10px 0 5px}
.suc-sub  {font-size:.92rem;color:var(--sub);line-height:1.6}
.suc-score-box{
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  border-radius:18px;padding:14px 20px;margin:14px 0;
}
.suc-score-lbl{font-size:.78rem;color:var(--sub)}
.suc-score-num{font-size:3rem;font-weight:800;color:var(--ind)}
.suc-detail{font-size:.88rem;color:var(--sub);line-height:1.65}
.suc-detail strong{color:var(--txt)}
</style>
</head>

<script>
// ── steps config ──
const STEPS = [
  { speech:'ยินดีที่ได้รู้จักครับ!<br>ขอทราบ<strong>ชื่อจริง</strong>ของคุณหน่อยนะครับ 🐾',

    icon:'👤', field:'firstName', optional:false },
  { speech:'เยี่ยมมากเลยครับ!<br>แล้วขอ<strong>ชื่อเล่น</strong>ของคุณด้วยนะครับ 😊',
    placeholder:'ตัวอย่าง: ชาย',   inputMode:'text', inputType:'text',
    icon:'😊', field:'nickname', optional:false },
  { speech:'น่ารักมากเลย!<br>คุณ<strong>อายุ</strong>เท่าไหร่ครับ? 🎂',
    placeholder:'ตัวอย่าง: 25',    inputMode:'numeric', inputType:'text',
    icon:'🎂', field:'age', optional:false },
  { speech:'เก่งมากครับ!<br>ขอ<strong>เบอร์โทรศัพท์</strong>ด้วยนะครับ 📱',
    placeholder:'ตัวอย่าง: 081-234-5678', inputMode:'tel', inputType:'tel',
    icon:'📱', field:'phone', optional:false },
  { speech:'เกือบเสร็จแล้วครับ!<br>มี<strong>โค้ดพิเศษ</strong>ไหมครับ? 🎟️',
    placeholder:'ตัวอย่าง: HAMSTER2024', inputMode:'text', inputType:'text',
    icon:'🎟️', field:'code', optional:true }
];
const TOTAL = STEPS.length;
const SHY_THRESHOLD = 50;
const HEARTS = ['❤️','💕','💖','💗','💝','💓','🩷','🌸'];

// ── state ──
let tapScore=0, curStep=0, isPopped=false, isShyMode=false;
let shyTimer=null, tapTimer=null;
const answers={};

// ── DOM ──
const $scoreVal  = document.getElementById('scoreVal');
const $stepCur   = document.getElementById('stepCur');
const $hamWrap   = document.getElementById('hamWrap');
const $hamSVG    = document.getElementById('hamSVG');
const $heartsL   = document.getElementById('heartsLayer');
const $bubble    = document.getElementById('bubble');
const $bubbleTxt = document.getElementById('bubbleText');
const $inputRow  = document.getElementById('inputRow');
const $inpIcon   = document.getElementById('inpIcon');
const $theInput  = document.getElementById('theInput');
const $nextBtn   = document.getElementById('nextBtn');
const $skipBtn   = document.getElementById('skipBtn');
const $overlay   = document.getElementById('successOverlay');
const $sucScore  = document.getElementById('sucScore');
const $sucDetail = document.getElementById('sucDetail');

// SVG face refs
const eyesNormal = document.getElementById('eyesNormal');
const eyesPopped = document.getElementById('eyesPopped');
const eyesHappy  = document.getElementById('eyesHappy');
const eyesShy    = document.getElementById('eyesShy');
const blushL     = document.getElementById('blushL');
const blushR     = document.getElementById('blushR');
const mouthNormal= document.getElementById('mouthNormal');
const mouthPopped= document.getElementById('mouthPopped');
const mouthHappy = document.getElementById('mouthHappy');
const mouthShy   = document.getElementById('mouthShy');

// ── init ──
function init(){
  buildPawBg();
  buildDots();
  setFace('normal');
  loadStep(0, false);

  // ── POP CAT mechanics ──
  // press → pop face; release → normal
  $hamWrap.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!isPopped) {
      isPopped = true;
      onTap();               // count score + hearts + sound
      setFace('popped');
      $hamSVG.classList.add('pop');
      spawnRipple();
    }
  });
  window.addEventListener('pointerup', () => {
    if (isPopped) {
      isPopped = false;
      $hamSVG.classList.remove('pop');
      setFace(isShyMode ? 'shy' : 'normal');
    }
  });
  window.addEventListener('pointercancel', () => {
    isPopped = false;
    $hamSVG.classList.remove('pop');
    setFace(isShyMode ? 'shy' : 'normal');
  });

  $nextBtn.addEventListener('click', onNext);
  $skipBtn.addEventListener('click', onSkip);
  $theInput.addEventListener('keydown', e => { if(e.key==='Enter') onNext(); });
}

// ── paw bg ──
function buildPawBg(){
  const bg=document.getElementById('pawBg');
  for(let i=0;i<18;i++){
    const s=document.createElement('span');
    s.textContent='🐾';
    const rot=(Math.random()*70-35).toFixed(1);
    s.style.cssText=`top:${(Math.random()*100).toFixed(1)}%;left:${(Math.random()*100).toFixed(1)}%;`
      +`--sz:${(1.2+Math.random()*2).toFixed(1)}rem;--rot:${rot}deg;`
      +`--dur:${(2.5+Math.random()*3).toFixed(1)}s;--delay:${(Math.random()*2).toFixed(2)}s;`;
    bg.appendChild(s);
  }
}

// ── dots ──
const $progDots=document.getElementById('progDots');
function buildDots(){
  $progDots.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='pdot';d.id=`pd${i}`;
    $progDots.appendChild(d);
  }
}
function refreshDots(s){
  for(let i=0;i<TOTAL;i++){
    const d=document.getElementById(`pd${i}`);
    d.className='pdot'+(i<s?' done':i===s?' active':'');
  }
}

// ── face states ──
function setFace(state){
  const show=el=>el.removeAttribute('display');
  const hide=el=>el.setAttribute('display','none');
  [eyesNormal,eyesPopped,eyesHappy,eyesShy].forEach(hide);
  [mouthNormal,mouthPopped,mouthHappy,mouthShy].forEach(hide);
  blushL.setAttribute('opacity','0');blushR.setAttribute('opacity','0');

  if(state==='normal'){
    show(eyesNormal);show(mouthNormal);
  } else if(state==='popped'){
    show(eyesPopped);show(mouthPopped);
    blushL.setAttribute('opacity','.4');blushR.setAttribute('opacity','.4');
  } else if(state==='happy'){
    show(eyesHappy);show(mouthHappy);
    blushL.setAttribute('opacity','.3');blushR.setAttribute('opacity','.3');
  } else if(state==='shy'){
    show(eyesShy);show(mouthShy);
    blushL.setAttribute('opacity','.8');blushR.setAttribute('opacity','.8');
  }
}

// ── tap ──
function onTap(){
  tapScore++;
  $scoreVal.textContent=tapScore;
  $scoreVal.classList.remove('bump');
  void $scoreVal.offsetWidth;
  $scoreVal.classList.add('bump');
  spawnHearts();
  playPopSound();
  if(tapScore===SHY_THRESHOLD) triggerShy();
}

function triggerShy(){
  isShyMode=true;
  if(!isPopped) setFace('shy');
  for(let i=0;i<8;i++) setTimeout(spawnHearts,i*70);
  if(shyTimer) clearTimeout(shyTimer);
  shyTimer=setTimeout(()=>{
    isShyMode=false;
    if(!isPopped) setFace('normal');
  },3500);
}

// ── ripple (on hamster itself) ──
function spawnRipple(){
  const r=document.createElement('div');
  r.className='ripple';
  $hamWrap.appendChild(r);
  setTimeout(()=>r.remove(),650);
}

// ── hearts ──
function spawnHearts(){
  const rect=$hamWrap.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  const count=Math.random()<.4?1:2;
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const h=document.createElement('span');
      h.textContent=HEARTS[Math.floor(Math.random()*HEARTS.length)];
      const dx=(Math.random()-.5)*90;
      const dy=-(65+Math.random()*65);
      h.style.cssText=`
        position:fixed;left:${cx}px;top:${cy}px;
        font-size:${(.9+Math.random()).toFixed(2)}rem;line-height:1;
        pointer-events:none;z-index:600;transform:translate(-50%,-50%);
      `;
      $heartsL.appendChild(h);
      h.animate([
        {transform:'translate(-50%,-50%) scale(.2)',opacity:1},
        {transform:`translate(calc(-50% + ${dx*.5}px),calc(-50% + ${dy*.45}px)) scale(1.4)`,opacity:.9,offset:.5},
        {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.5)`,opacity:0}
      ],{duration:1100,easing:'ease-out',fill:'forwards'})
      .addEventListener('finish',()=>h.remove());
    },i*80);
  }
}

// ── pop sound (Web Audio API) ──
let audioCtx=null;
function playPopSound(){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.type='sine';
    osc.frequency.setValueAtTime(680,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(260,audioCtx.currentTime+.1);
    gain.gain.setValueAtTime(.25,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime+.12);
  }catch(e){}
}

// ── form ──
function loadStep(s,animate){
  curStep=s;
  const st=STEPS[s];
  $stepCur.textContent=s+1;
  refreshDots(s);
  $inpIcon.textContent=st.icon;
  $theInput.setAttribute('inputmode',st.inputMode);
  $theInput.type=st.inputType;
  $theInput.placeholder=st.placeholder;
  $theInput.value='';
  $skipBtn.style.display=st.optional?'':'none';

  if(animate){
    $bubble.classList.add('swap-out');
    setTimeout(()=>{
      $bubbleTxt.innerHTML=st.speech;
      $bubble.classList.remove('swap-out');
      $bubble.classList.add('swap-in');
      setTimeout(()=>$bubble.classList.remove('swap-in'),280);
    },190);
  } else {
    $bubbleTxt.innerHTML=st.speech;
  }

  setTimeout(()=>$theInput.focus(),350);
}

function onNext(){
  const val=$theInput.value.trim();
  if(!val){
    $inputRow.classList.remove('shake');
    void $inputRow.offsetWidth;
    $inputRow.classList.add('shake');
    setTimeout(()=>$inputRow.classList.remove('shake'),400);
    return;
  }
  answers[STEPS[curStep].field]=val;
  advance();
}
function onSkip(){
  answers[STEPS[curStep].field]='';
  advance();
}
function advance(){
  // happy face briefly
  setFace('happy');
  if(tapTimer) clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>setFace(isShyMode?'shy':'normal'),700);

  if(curStep<TOTAL-1) loadStep(curStep+1,true);
  else showSuccess();
}

// ── success ──
function showSuccess(){
  $sucScore.textContent=tapScore;
  const name=answers.firstName||'เพื่อน';
  const nick=answers.nickname?` (${answers.nickname})`:'';
  $sucDetail.innerHTML=
    `ยินดีต้อนรับ <strong>${name}${nick}</strong>!<br>`+
    `แต้มโบนัสของคุณคือ <strong>${tapScore}</strong> แต้ม 🎊`;
  $overlay.classList.add('show');
  for(let i=0;i<14;i++) setTimeout(spawnHearts,i*90);
}

init();
</script>
</body>
</html>
